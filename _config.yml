baseurl: ""

permalink: /:year/:month/:day/:title/
paginate: 8
paginate_path: /page/:num/

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag

feed:
  path: feed.xml

# 申请服务后填入；留空时网站会显示准备中的说明。
buttondown_username: ""
hyvor_website_id: ""

