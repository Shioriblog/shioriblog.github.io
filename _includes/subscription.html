<section class="subscription" aria-labelledby="subscribe-title">
  <h2 id="subscribe-title">订阅新文章</h2>
  <p>新文章发布时收到一封邮件，或者使用 <a href="{{ '/feed.xml' | relative_url }}">RSS</a> 阅读。</p>

  <div id="brevo-subscribe-success" class="subscription-status" role="status" hidden>
    感谢订阅！您会在博客更新时收到邮件推送 ^_^
  </div>

  <form
    id="brevo-subscribe-form"
    action="https://3693b1ad.sibforms.com/serve/MUIFAJi0O7F8qH7agDpwSWg6oAHlzhb-LHTu98WhY3r3yl4pYcWiAApt44BkjoJrBlTeQHIAJRBKyCJLlhjq-y0oURNC0TfTIjtSMN0A_Ft5ATNSyb3dfEkz3_sxQ9YSL7eF-0Q37f-Mm-WN_-Aq0HFa6-1qqdu-e6LoV3T2ivgpGah7gtKfxP7jitbT8coO_FQfJm_yvkHp_6SzIQ=="
    method="POST"
    target="brevo-subscribe-target"
  >
    <label class="sr-only" for="brevo-email">Email address</label>
    <div class="inline-form brevo-inline-form">
      <input id="brevo-email" type="email" name="EMAIL" placeholder="Email address" autocomplete="email" required>
      <button id="brevo-subscribe-button" type="submit">订阅</button>
    </div>
    <input type="text" name="email_address_check" value="" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;">
    <input type="hidden" name="locale" value="en">
  </form>

  <iframe id="brevo-subscribe-target" name="brevo-subscribe-target" title="订阅提交结果" hidden></iframe>

  <style>
    .subscription .brevo-inline-form {
      max-width: 28rem;
      gap: .65rem;
      align-items: center;
    }

    .subscription #brevo-email {
      padding: .5rem .65rem;
      border-right: 1px solid #aaa49b;
      font-size: .9rem;
      line-height: 1.35;
    }

    .subscription #brevo-subscribe-button {
      flex: 0 0 auto;
      padding: .5rem .85rem;
      font-size: .76rem;
      line-height: 1.35;
      white-space: nowrap;
    }

    .subscription-status {
      max-width: 28rem;
      margin: 0 0 .9rem;
      padding: .6rem .75rem;
      border-left: 2px solid var(--accent);
      background: var(--soft);
      color: var(--body);
      font-family: var(--sans);
      font-size: .76rem;
      line-height: 1.55;
    }

    @media (max-width: 560px) {
      .subscription .brevo-inline-form {
        max-width: 100%;
        gap: .5rem;
      }
    }
  </style>

  <script>
    (() => {
      const form = document.getElementById('brevo-subscribe-form')
      const frame = document.getElementById('brevo-subscribe-target')
      const success = document.getElementById('brevo-subscribe-success')
      const button = document.getElementById('brevo-subscribe-button')
      if (!form || !frame || !success || !button) return

      let submitted = false

      form.addEventListener('submit', () => {
        submitted = true
        button.disabled = true
        button.textContent = '提交中…'
        success.hidden = true
      })

      frame.addEventListener('load', () => {
        if (!submitted) return
        submitted = false
        success.hidden = false
        form.reset()
        button.disabled = false
        button.textContent = '订阅'
      })
    })()
  </script>
</section>
