<section class="subscription" aria-labelledby="subscribe-title">
  <h2 id="subscribe-title">订阅新文章</h2>
  <p>新文章发布时收到一封邮件，或者使用 <a href="{{ '/feed.xml' | relative_url }}">RSS</a> 阅读。</p>

  <link rel="stylesheet" href="https://sibforms.com/forms/end-form/build/sib-styles.css">

  <style>
    .subscription .sib-form {
      margin: 0;
      padding: 0;
      background: transparent !important;
      text-align: left !important;
    }

    .subscription .sib-form-container,
    .subscription #sib-container {
      width: 100%;
      max-width: 34rem;
      margin: 0;
      padding: 0;
      border: 0 !important;
      border-radius: 0 !important;
      background: transparent !important;
      text-align: left !important;
    }

    .subscription .sib-form-message-panel {
      display: none;
      max-width: 34rem;
      margin: 0 0 .9rem;
      padding: .65rem .8rem;
      border: 0 !important;
      border-left: 2px solid var(--accent) !important;
      border-radius: 0 !important;
      background: var(--soft) !important;
      color: var(--body) !important;
      font-family: var(--sans) !important;
      font-size: .78rem !important;
      line-height: 1.6 !important;
      text-align: left !important;
    }

    .subscription .sib-form-message-panel__text,
    .subscription .sib-form-message-panel__text--center {
      display: block !important;
      text-align: left !important;
    }

    .subscription .sib-notification__icon,
    .subscription .entry__label,
    .subscription .entry__specification {
      display: none !important;
    }

    .subscription #sib-form > div {
      padding: 0 !important;
    }

    .subscription .sib-input,
    .subscription .sib-form-block,
    .subscription .form__entry,
    .subscription .form__label-row,
    .subscription .entry__field {
      margin: 0 !important;
      padding: 0 !important;
    }

    .subscription .entry__field {
      border: 0 !important;
      background: transparent !important;
    }

    .subscription .entry__field input {
      width: 100% !important;
      height: auto !important;
      margin: 0 !important;
      padding: .65rem .75rem !important;
      border: 1px solid #aaa49b !important;
      border-right: 0 !important;
      border-radius: 0 !important;
      background: #fff !important;
      color: var(--ink) !important;
      box-shadow: none !important;
      font: inherit !important;
      font-size: 1rem !important;
      line-height: 1.5 !important;
    }

    .subscription .entry__field input::placeholder {
      color: #b8c0cb !important;
      opacity: 1 !important;
    }

    .subscription .entry__error {
      display: block;
      margin-top: .45rem;
      padding: 0 !important;
      border: 0 !important;
      background: transparent !important;
      color: var(--muted) !important;
      font-family: var(--sans) !important;
      font-size: .72rem !important;
      line-height: 1.5 !important;
      text-align: left !important;
    }

    .subscription .brevo-inline-form {
      display: flex;
      max-width: 34rem;
      align-items: flex-start;
    }

    .subscription .brevo-input-wrap {
      flex: 1;
      min-width: 0;
    }

    .subscription .sib-form-block__button {
      flex: 0 0 auto;
      height: auto !important;
      min-height: 0 !important;
      margin: 0 !important;
      padding: .65rem 1rem !important;
      border: 1px solid #aaa49b !important;
      border-radius: 0 !important;
      background: var(--ink) !important;
      color: #fff !important;
      font-family: var(--sans) !important;
      font-size: .82rem !important;
      font-weight: 400 !important;
      line-height: 1.5 !important;
      text-align: center !important;
      cursor: pointer;
    }

    .subscription .sib-form-block__button:hover {
      background: var(--accent) !important;
    }

    .subscription .sib-hide-loader-icon {
      display: none !important;
    }

    @media (max-width: 560px) {
      .subscription .brevo-inline-form {
        display: block;
      }

      .subscription .entry__field input {
        border-right: 1px solid #aaa49b !important;
      }

      .subscription .sib-form-block__button {
        margin-top: .65rem !important;
      }
    }
  </style>

  <div class="sib-form">
    <div id="sib-form-container" class="sib-form-container">
      <div id="error-message" class="sib-form-message-panel">
        <div class="sib-form-message-panel__text sib-form-message-panel__text--center">
          <svg viewBox="0 0 512 512" class="sib-icon sib-notification__icon" aria-hidden="true">
            <path d="M256 40c118.621 0 216 96.075 216 216 0 119.291-96.61 216-216 216-119.244 0-216-96.562-216-216 0-119.203 96.602-216 216-216m0-32C119.043 8 8 119.083 8 256c0 136.997 111.043 248 248 248s248-111.003 248-248C504 119.083 392.957 8 256 8z" />
          </svg>
          <span class="sib-form-message-panel__inner-text">订阅没有成功，请稍后再试一次。</span>
        </div>
      </div>
      <div></div>

      <div id="success-message" class="sib-form-message-panel">
        <div class="sib-form-message-panel__text sib-form-message-panel__text--center">
          <svg viewBox="0 0 512 512" class="sib-icon sib-notification__icon" aria-hidden="true">
            <path d="M256 8C119.033 8 8 119.033 8 256s111.033 248 248 248 248-111.033 248-248S392.967 8 256 8z" />
          </svg>
          <span class="sib-form-message-panel__inner-text">感谢订阅！您会在博客更新时收到邮件推送 ^_^</span>
        </div>
      </div>
      <div></div>

      <div id="sib-container" class="sib-container--large sib-container--vertical">
        <form id="sib-form" method="POST" action="https://3693b1ad.sibforms.com/serve/MUIFAJi0O7F8qH7agDpwSWg6oAHlzhb-LHTu98WhY3r3yl4pYcWiAApt44BkjoJrBlTeQHIAJRBKyCJLlhjq-y0oURNC0TfTIjtSMN0A_Ft5ATNSyb3dfEkz3_sxQ9YSL7eF-0Q37f-Mm-WN_-Aq0HFa6-1qqdu-e6LoV3T2ivgpGah7gtKfxP7jitbT8coO_FQfJm_yvkHp_6SzIQ==" data-type="subscription">
          <div class="brevo-inline-form">
            <div class="brevo-input-wrap">
              <div class="sib-input sib-form-block">
                <div class="form__entry entry_block">
                  <div class="form__label-row">
                    <label class="entry__label" for="EMAIL" data-required="*">Enter your email address to subscribe</label>
                    <div class="entry__field">
                      <input class="input" type="text" id="EMAIL" name="EMAIL" autocomplete="off" value="" placeholder="Email address" data-required="true" required>
                    </div>
                  </div>
                  <label class="entry__error entry__error--primary"></label>
                  <label class="entry__specification">Provide your email address to subscribe.</label>
                </div>
              </div>
            </div>

            <div class="sib-form-block">
              <button class="sib-form-block__button sib-form-block__button-with-loader" form="sib-form" type="submit">
                <svg class="icon clickable__icon progress-indicator__icon sib-hide-loader-icon" viewBox="0 0 512 512" aria-hidden="true">
                  <path d="M460.116 373.846l-20.823-12.022c-5.541-3.199-7.54-10.159-4.663-15.874 30.137-59.886 28.343-131.652-5.386-189.946-33.641-58.394-94.896-95.833-161.827-99.676C261.028 55.961 256 50.751 256 44.352V20.309c0-6.904 5.808-12.337 12.703-11.982 83.556 4.306 160.163 50.864 202.11 123.677 42.063 72.696 44.079 162.316 6.031 236.832-3.14 6.148-10.75 8.461-16.728 5.01z" />
                </svg>
                订阅
              </button>
            </div>
          </div>

          <input type="text" name="email_address_check" value="" class="input--hidden">
          <input type="hidden" name="locale" value="en">
        </form>
      </div>
    </div>
  </div>

  <script>
    window.REQUIRED_CODE_ERROR_MESSAGE = 'Please choose a country code';
    window.LOCALE = 'en';
    window.EMAIL_INVALID_MESSAGE = window.SMS_INVALID_MESSAGE = '邮箱格式好像不对，请检查后再试一次。';
    window.REQUIRED_ERROR_MESSAGE = '请输入邮箱地址。';
    window.GENERIC_INVALID_MESSAGE = '邮箱格式好像不对，请检查后再试一次。';
    window.INVALID_NUMBER = '邮箱格式好像不对，请检查后再试一次。';
    window.INVALID_DATE = 'Please enter a valid date';
    window.REQUIRED_MULTISELECT_MESSAGE = 'Please select at least 1 option';
    window.translation = {
      common: {
        selectedList: '{quantity} list selected',
        selectedLists: '{quantity} lists selected',
        selectedOption: '{quantity} selected',
        selectedOptions: '{quantity} selected'
      }
    };
    var AUTOHIDE = Boolean(0);
  </script>

  <script defer src="https://sibforms.com/forms/end-form/build/main.js"></script>
</section>
