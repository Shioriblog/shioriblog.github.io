{% if site.twikoo_env_id != '' %}
<section class="comments" id="comments-section" aria-labelledby="comments-title">
  <h2 id="comments-title">Comments</h2>
  <div id="tcomment"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/twikoo@1.7.22/dist/twikoo.min.js"></script>
<script>
  (() => {
    const container = document.getElementById('tcomment')
    if (!container || typeof twikoo === 'undefined') return

    twikoo.init({
      envId: {{ site.twikoo_env_id | jsonify }},
      el: '#tcomment',
      path: {{ page.url | jsonify }},
      lang: 'zh-CN'
    })
  })()
</script>
{% endif %}
